name: Check Upstream

on:
#  schedule:
#    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      manual_tag:
        description: "Upstream tag to check (overrides DEFAULT_TAG and the latest tag)"
        required: false
        default: ""
        type: string
      auto_merge:
        description: "Start merge.yml when a new upstream tag is found"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Passed to merge.yml: do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none/inherit: use repository variable NOTIFY_MODE; changes: only new tags and failures; always: also report in-sync runs"
        required: false
        default: none
        type: choice
        options:
          - none
          - inherit
          - changes
          - always

permissions:
  contents: read
  issues: write
  actions: write

env:
  UPSTREAM_REPO: amnezia-vpn/amneziawg-linux-kernel-module
  # Repository variable TELEGRAM_NOTIFY=false is a global kill switch.
  TELEGRAM_ENABLED: ${{ vars.TELEGRAM_NOTIFY != 'false' }}
  NOTIFY_MODE_INPUT: ${{ inputs.notify_mode }}
  NOTIFY_MODE_VAR: ${{ vars.NOTIFY_MODE }}
  AUTO_MERGE: ${{ inputs.auto_merge }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          # Explicit dispatch values win over the repository variable; none/inherit defer to it.
          raw="${NOTIFY_MODE_INPUT:-none}"
          case "$raw" in
            changes|always) mode="$raw" ;;
            *) mode="${NOTIFY_MODE_VAR:-changes}" ;;
          esac
          case "$mode" in
            none|changes|always) ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${mode}' - falling back to changes"; mode=changes ;;
          esac
          if [ "${TELEGRAM_ENABLED:-true}" != "true" ]; then
            echo "TELEGRAM_NOTIFY=false - notifications disabled"
            mode=none
          fi
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw}, repository=${NOTIFY_MODE_VAR:-unset})"

      - name: Resolve target upstream tag
        id: resolve
        env:
          MANUAL_TAG: ${{ inputs.manual_tag }}
          DEFAULT_TAG: ${{ vars.DEFAULT_TAG }}
        run: |
          set -euo pipefail

          normalize() {
            local t="${1#refs/tags/}"
            printf '%s' "${t#v}"
          }

          remote_tags() {
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" \
              | awk -F/ '{print $NF}'
          }

          tags="$(remote_tags)"

          tag="${MANUAL_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${DEFAULT_TAG:-}"
          fi
          if [ -z "$tag" ]; then
            tag="$(printf '%s\n' "$tags" | sort -V | tail -n1)"
          fi

          # Accept both v-prefixed and bare tags; branches are left untouched.
          if [ -n "$tag" ] && ! printf '%s\n' "$tags" | grep -qx "$tag"; then
            if printf '%s\n' "$tags" | grep -qx "v${tag#v}"; then
              tag="v${tag#v}"
            fi
          fi

          if [ -z "$tag" ]; then
            echo "::error::Could not resolve upstream tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$(normalize "$tag")" >> "$GITHUB_OUTPUT"

      - name: Compare with internal/config/version
        id: compare
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_VERSION: ${{ steps.resolve.outputs.tag_version }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < internal/config/version)"
          base_version="${base#v}"
          echo "upstream=${TAG} (${TAG_VERSION}) base=v${base_version}"
          echo "base=v${base_version}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_VERSION" = "$base_version" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "in sync — nothing to do"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create migration issue
        id: issue
        if: ${{ steps.compare.outputs.in_sync == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BASE: ${{ steps.compare.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Upstream ${TAG} released — VDS migration needed (base: ${BASE})"
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"${TAG}\"" --json number,url --jq '.[0] // empty')"
          if [ -n "$existing" ]; then
            echo "issue for ${TAG} already open — not duplicating"
            echo "url=$(printf '%s' "$existing" | jq -r .url)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(cat <<EOF
          Upstream [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) released **${TAG}**; VDS base is **${BASE}**.

          ## VDS migration checklist
          - [ ] Run \`merge.yml\` with \`upstream_ref=${TAG}\` and an empty \`kernel_version\` (latest kernel).
          - [ ] Verify the ISRHEL10/ISRHEL100/ISRHEL101 guards in \`src/compat/compat.h\`.
          - [ ] Review root-level upstream files reported by \`merge.yml\`.
          - [ ] Confirm \`internal/config/{current,version,upstream}\` and \`src/version.h\` after the merge.
          - [ ] \`stable.yml\` runs automatically from \`merge.yml\`; do not start it manually.
          - [ ] Update \`docs/CHANGELOG.md\`.

          Changelog: https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG}
          EOF
          )"
          url="$(gh issue create --repo "$REPO" --title "$title" --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Start merge workflow
        if: ${{ steps.compare.outputs.in_sync == 'false' && inputs.auto_merge }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run merge.yml \
            --repo "$REPO" \
            --ref "$DEFAULT_BRANCH" \
            -f upstream_ref="$TAG" \
            -f kernel_version="" \
            -f vds_branch="$DEFAULT_BRANCH" \
            -f notify_mode="$NOTIFY_MODE" \
            -F dry_run="$DRY_RUN"

      - name: Notify Telegram
        if: ${{ always() && env.TELEGRAM_ENABLED == 'true' && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BASE: ${{ steps.compare.outputs.base }}
          IN_SYNC: ${{ steps.compare.outputs.in_sync }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # One run produces exactly one message: update, in-sync or failure.
          if [ "$JOB_STATUS" != "success" ]; then
            text="check-upstream: ${JOB_STATUS}. Upstream: ${TAG:-unknown}. Logs: ${run_url}"
          elif [ "${IN_SYNC:-}" = "true" ]; then
            if [ "${NOTIFY_MODE:-changes}" != "always" ]; then
              echo "upstream ${TAG} is in sync with ${BASE} — nothing to report (notify_mode=${NOTIFY_MODE:-changes})"
              exit 0
            fi
            text="check-upstream: upstream ${TAG} is in sync with VDS base ${BASE}. Logs: ${run_url}"
          else
            if [ "${AUTO_MERGE:-false}" = "true" ]; then
              merge_state="started (dry_run=${DRY_RUN:-true})"
            else
              merge_state="not started (auto_merge=false)"
            fi
            text="check-upstream: new upstream ${TAG} (VDS base ${BASE}). merge.yml: ${merge_state}. Issue: ${ISSUE_URL:-none}. Logs: ${run_url}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
