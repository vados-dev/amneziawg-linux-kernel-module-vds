# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Check Upstream

on:
#  schedule:
#    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      manual_tag:
        description: "Upstream tag to check (overrides DEFAULT_TAG and the latest tag)"
        required: false
        default: ""
        type: string
      kernel_version:
        description: "Kernel version for the CI image; empty = latest from repos"
        required: false
        default: ""
        type: string
      auto_merge:
        description: "Run merge.yml in this same run when a new upstream tag is found"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Passed to merge.yml: do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none: disable; changes: only new tags and failures; always: also in-sync runs"
        required: false
        default: changes
        type: choice
        options:
          - none
          - changes
          - always

permissions:
  contents: write
  issues: write
  packages: write

env:
  UPSTREAM_REPO: amnezia-vpn/amneziawg-linux-kernel-module
  CI_IMAGE_REGISTRY_REF: ghcr.io/vados-dev/amneziawg-linux-kernel-module-vds/centos10
  NOTIFY_MODE: ${{ inputs.notify_mode || 'changes' }}

# Два прогона не должны наперегонки собирать образ и мержить один тег:
# ставим в очередь, не отменяем.
concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      tag_version: ${{ steps.resolve.outputs.tag_version }}
      base: ${{ steps.compare.outputs.base }}
      in_sync: ${{ steps.compare.outputs.in_sync }}
      notify_mode: ${{ steps.notify.outputs.notify_mode }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          raw="${NOTIFY_MODE:-changes}"
          case "$raw" in
            none) mode=none ;;
            changes|always) mode="$raw" ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${raw}' - falling back to changes"; mode=changes ;;
          esac
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw})"

      - name: Resolve target upstream tag
        id: resolve
        env:
          MANUAL_TAG: ${{ inputs.manual_tag }}
          DEFAULT_TAG: ${{ vars.DEFAULT_TAG }}
        run: |
          set -euo pipefail

          normalize() {
            local t="${1#refs/tags/}"
            printf '%s' "${t#v}"
          }

          remote_tags() {
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" \
              | awk -F/ '{print $NF}'
          }

          tags="$(remote_tags)"

          tag="${MANUAL_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${DEFAULT_TAG:-}"
          fi
          if [ -z "$tag" ]; then
            tag="$(printf '%s\n' "$tags" | sort -V | tail -n1)"
          fi

          if [ -n "$tag" ] && ! printf '%s\n' "$tags" | grep -qx "$tag"; then
            if printf '%s\n' "$tags" | grep -qx "v${tag#v}"; then
              tag="v${tag#v}"
            fi
          fi

          if [ -z "$tag" ] || ! printf '%s\n' "$tags" | grep -qx "$tag"; then
            echo "::error::tag '${tag:-<empty>}' not found in ${UPSTREAM_REPO}"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$(normalize "$tag")" >> "$GITHUB_OUTPUT"

      - name: Compare with internal/config/version
        id: compare
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_VERSION: ${{ steps.resolve.outputs.tag_version }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < internal/config/version)"
          base_version="${base#v}"
          echo "upstream=${TAG} (${TAG_VERSION}) base=v${base_version}"
          echo "base=v${base_version}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_VERSION" = "$base_version" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "in sync — nothing to do"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create migration issue
        id: issue
        if: ${{ steps.compare.outputs.in_sync == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BASE: ${{ steps.compare.outputs.base }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Upstream ${TAG} released — VDS migration needed (base: ${BASE})"
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"${TAG}\"" --json number,url --jq '.[0] // empty')"
          if [ -n "$existing" ]; then
            echo "issue for ${TAG} already open — not duplicating"
            echo "url=$(printf '%s' "$existing" | jq -r .url)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(cat <<EOF
          Upstream [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) released **${TAG}**; VDS base is **${BASE}**.

          ## VDS migration checklist
          - [ ] CI image is rebuilt automatically by this run (kernel: latest, copr amneziawg-dkms).
          - [ ] \`merge.yml\` runs automatically with \`auto_merge=true\`; for a manual kernel use \`kernel_version\` input.
          - [ ] Verify the compat guards in \`src/compat/compat.h\` (compat-probes.sh will fail loudly if anchors moved).
          - [ ] Review root-level upstream files reported by \`merge.yml\`.
          - [ ] Confirm \`internal/config/{current,version,upstream}\` and \`src/version.h\` after the merge.
          - [ ] \`stable.yml\` runs automatically from \`merge.yml\`; do not start it manually.
          - [ ] Update \`docs/CHANGELOG.md\`.

          Changelog: https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG}
          EOF
          )"
          url="$(gh issue create --repo "$REPO" --title "$title" --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (check result)
        if: ${{ always() && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BASE: ${{ steps.compare.outputs.base }}
          IN_SYNC: ${{ steps.compare.outputs.in_sync }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" != "success" ]; then
            text="check-upstream: ${JOB_STATUS}. Upstream: ${TAG:-unknown}. Logs: ${run_url}"
          elif [ "${IN_SYNC:-}" = "true" ]; then
            if [ "${NOTIFY_MODE:-changes}" != "always" ]; then
              echo "upstream ${TAG} is in sync with ${BASE} — nothing to report (notify_mode=${NOTIFY_MODE:-changes})"
              exit 0
            fi
            text="check-upstream: upstream ${TAG} is in sync with VDS base ${BASE}. Logs: ${run_url}"
          else
            if [ "${{ inputs.auto_merge }}" = "true" ]; then
              merge_state="merge started in this run (dry_run=${{ inputs.dry_run }})"
            else
              merge_state="merge not started (auto_merge=false)"
            fi
            text="check-upstream: new upstream ${TAG} (VDS base ${BASE}). CI image will be rebuilt. ${merge_state}. Issue: ${ISSUE_URL:-none}. Logs: ${run_url}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null

  build-image:
    needs: check
    if: needs.check.outputs.in_sync == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe kernel and copr module versions
        id: probe
        env:
          KERNEL_IN: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          # Та же логика источников, что и в Dockerfile ниже:
          # stream10 + epel (copr tigro/amneziawg без него не подключить) + copr.
          out="$(docker run --rm quay.io/centos/centos:stream10 bash -c '
            set -euo pipefail
            dnf -y install -q dnf-plugins-core epel-release >/dev/null
            dnf config-manager --set-enabled crb >/dev/null 2>&1 || true
            dnf copr enable -y tigro/amneziawg >/dev/null 2>&1
            dnf makecache -q >/dev/null 2>&1
            k="$(dnf repoquery -q --latest-limit=1 kernel-core --qf "%{version}-%{release}.%{arch}" | tail -n1)"
            a="$(dnf repoquery -q --latest-limit=1 amneziawg-dkms --qf "%{version}" | tail -n1)"
            [ -n "$k" ] && [ -n "$a" ] || { echo "probe failed: k=$k a=$a" >&2; exit 1; }
            echo "$k $a"
          ')"
          kernel="$(awk '{print $1}' <<<"$out")"
          awg="$(awk '{print $2}' <<<"$out")"
          if [ -n "$KERNEL_IN" ]; then
            kernel="$KERNEL_IN"
            echo "kernel override from input: $kernel"
          fi
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "awg=$awg" >> "$GITHUB_OUTPUT"
          echo "Probed: kernel=$kernel amneziawg-dkms=$awg"

      - name: Check existing image
        id: existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ env.CI_IMAGE_REGISTRY_REF }}
        run: |
          set -euo pipefail
          if printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin 2>/dev/null \
             && docker pull -q "${REF}:current" >/dev/null 2>&1; then
            k="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version.kernel" }}' "${REF}:current" 2>/dev/null || true)"
            a="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version.amneziawg" }}' "${REF}:current" 2>/dev/null || true)"
            {
              echo "kernel=$k"
              echo "awg=$a"
            } >> "$GITHUB_OUTPUT"
            echo "existing :current: kernel=$k amneziawg=$a"
          else
            echo "no existing :current — will build"
          fi

      - name: Generate Dockerfile
        run: |
          set -euo pipefail
          cat > /tmp/ci-image.Dockerfile <<'DOCKERFILE'
          FROM quay.io/centos/centos:stream10

          ARG KERNEL_VERSION
          ARG AWG_VERSION

          # EPEL обязателен: amneziawg-dkms тянет dkms и зависимости из epel.
          RUN dnf -y install dnf-plugins-core epel-release
          RUN dnf config-manager --set-enabled crb >/dev/null 2>&1 || true
          RUN dnf copr enable -y tigro/amneziawg

          # amneziawg-dkms без pin: ставим то, что copr отдаёт на момент сборки,
          # фактическая версия видна в LABEL ниже.
          RUN dnf -y install \
                "kernel-${KERNEL_VERSION}" "kernel-core-${KERNEL_VERSION}" \
                "kernel-devel-${KERNEL_VERSION}" "kernel-devel-matched-${KERNEL_VERSION}" \
                "kernel-headers-${KERNEL_VERSION}" \
                gcc make git tar gzip which curl libmnl-devel pkgconf dkms amneziawg-dkms && \
              dnf clean all

          LABEL org.opencontainers.image.version.kernel="${KERNEL_VERSION}" \
                org.opencontainers.image.version.amneziawg="${AWG_VERSION}" \
                org.opencontainers.image.source="https://github.com/amnezia-vpn/amneziawg-linux-kernel-module"

          DOCKERFILE
          echo "Dockerfile generated"
          cat /tmp/ci-image.Dockerfile

      - name: Build and push CI image
        id: meta
        if: steps.existing.outputs.kernel != steps.probe.outputs.kernel || steps.existing.outputs.awg != steps.probe.outputs.awg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ env.CI_IMAGE_REGISTRY_REF }}
          KERNEL: ${{ steps.probe.outputs.kernel }}
          AWG: ${{ steps.probe.outputs.awg }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build \
            --build-arg KERNEL_VERSION="${KERNEL}" \
            --build-arg AWG_VERSION="${AWG}" \
            -f /tmp/ci-image.Dockerfile \
            -t "${REF}:current" \
            /tmp
          docker push "${REF}:current"
          echo "image_ref=${REF}:current" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REF}:current (kernel=${KERNEL}, amneziawg-dkms=${AWG})"

      - name: Delete stale image versions
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.event.repository.owner.login }}
          PACKAGE: amneziawg-linux-kernel-module-vds/centos10
        run: |
          set -euo pipefail
          # Пакет после ghcr.io/<owner>/ — с вложенным именем, без owner-префикса.
          # Ищем на орг-эндпоинте, потом на user-ском.
          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" >/dev/null 2>&1; then
            base="/orgs/${OWNER}/packages/container/${PACKAGE}"
          elif gh api "/user/packages/container/${PACKAGE}/versions" >/dev/null 2>&1; then
            base="/user/packages/container/${PACKAGE}"
          else
            echo "::warning::package ${PACKAGE} not found — skipping cleanup"
            exit 0
          fi
          ids="$(gh api "${base}/versions" --paginate --jq '.[].id')"
          if [ -z "$ids" ]; then
            echo "no package versions — nothing to delete"
            exit 0
          fi
          keep="$(printf '%s\n' "$ids" | head -n1)"
          echo "keeping newest version id=${keep}"
          for id in $ids; do
            [ "$id" = "$keep" ] && continue
            gh api -X DELETE "${base}/versions/$id" \
              && echo "deleted stale version $id" \
              || echo "::warning::failed to delete version $id"
          done

      - name: Notify Telegram (build failure)
        if: ${{ failure() && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then exit 0; fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text="check-upstream: CI image build failed. Logs: ${run_url}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null

  merge:
    needs: [check, build-image]
    if: needs.check.outputs.in_sync == 'false' && inputs.auto_merge
    uses: ./.github/workflows/merge.yml
    with:
      upstream_ref: ${{ needs.check.outputs.tag }}
      kernel_version: ${{ inputs.kernel_version }}
      vds_branch: ${{ github.event.repository.default_branch }}
      dry_run: ${{ inputs.dry_run }}
      notify_mode: ${{ needs.check.outputs.notify_mode }}
      ci_image_ref: ${{ needs.build-image.outputs.image_ref }}
    secrets: inherit
