name: Merge Upstream

on:
  workflow_call:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch"
        required: false
        default: "master"
        type: string
      dockerfile:
        description: "Dockerfile in location docker/ci-images/"
        required: true
        default: "Dockerfile.new"
        type: string
      kernel_version:
        description: "Target kernel version; empty means the latest available"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "VDS branch to merge into"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none|inherit|changes|always; none and inherit defer to repository variable NOTIFY_MODE"
        required: false
        default: "none"
        type: string
      ci_image_source:
        description: "registry = pinned GHCR image; build = build tmp-* image in this run (no push)"
        required: false
        default: "build"
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch"
        required: false
        default: "master"
        type: string
      dockerfile:
        description: "Dockerfile in location docker/ci-images/"
        required: true
        default: "Dockerfile.new"
        type: string
      kernel_version:
        description: "Target kernel version (empty = latest, or e.q. 6.12.0-281.el10.x86_64)"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "VDS branch to merge into"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none/inherit: use repository variable NOTIFY_MODE; changes: failures and real merges; always: also dry-run results"
        required: false
        default: none
        type: choice
        options:
          - none
          - inherit
          - changes
          - always
      ci_image_source:
        description: "registry = pinned GHCR image; build = build tmp-* image in this run (no push)"
        required: false
        default: registry
        type: choice
        options:
          - registry
          - build

permissions:
  contents: write
  issues: write
  # Нужен для чтения приватного пакета GHCR, если образ centos-10 не публичный.
  packages: read

env:
  UPSTREAM_REPO: amnezia-vpn/amneziawg-linux-kernel-module
  # Repository variable TELEGRAM_NOTIFY=false is a global kill switch.
  TELEGRAM_ENABLED: ${{ vars.TELEGRAM_NOTIFY != 'false' }}
  NOTIFY_MODE_INPUT: ${{ inputs.notify_mode }}
  NOTIFY_MODE_VAR: ${{ vars.NOTIFY_MODE }}
  # Пиновый образ из GHCR. Если пакет принадлежит другому репозиторию и закрыт,
  # GITHUB_TOKEN его не прочтёт — понадобится PAT в секретах.
  CI_IMAGE_REGISTRY_REF: ghcr.io/vados-dev/build-images/amneziawg-kernel-centos10:lts

jobs:
  build_ci_image:
    if: ${{ inputs.ci_image_source == 'build' }}
    uses: ./.github/workflows/build-ci-image.yml
    with:
      operation: build
      dockerfile: ${{ inputs.dockerfile }}
      base_image: quay.io/centos/centos:stream10
      build_platforms: linux/amd64
      # tmp-* гарантирует отсутствие пуша; run_id в имени делает concurrency-группу
      # уникальной, чтобы параллельные вызовы не вставали в очередь друг за другом.
      image_name: tmp-${{ github.run_id }}
      width_kernel: ${{ inputs.kernel_version }}
      width_dkms: false
      width_base_packages: "gcc make git tar gzip which curl wget libmnl-devel pkgconf python3 python3-pip dkms"
      push: false
    secrets: inherit

  merge:
    needs: [build_ci_image]
    # build_ci_image пропускается в режиме registry — это не ошибка.
    if: ${{ !cancelled() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_IMAGE_SOURCE: ${{ inputs.ci_image_source }}
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      kernel_version: ${{ steps.build.outputs.kernel_version }}
      version: ${{ steps.prepare.outputs.version }}
      vds_branch: ${{ steps.resolve.outputs.vds_branch }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      notify_mode: ${{ steps.notify.outputs.notify_mode }}
    steps:
      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          # Explicit dispatch values win over the repository variable; none/inherit defer to it.
          raw="${NOTIFY_MODE_INPUT:-none}"
          case "$raw" in
            changes|always) mode="$raw" ;;
            *) mode="${NOTIFY_MODE_VAR:-changes}" ;;
          esac
          case "$mode" in
            none|changes|always) ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${mode}' - falling back to changes"; mode=changes ;;
          esac
          if [ "${TELEGRAM_ENABLED:-true}" != "true" ]; then
            echo "TELEGRAM_NOTIFY=false - notifications disabled"
            mode=none
          fi
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw}, repository=${NOTIFY_MODE_VAR:-unset})"

      - name: Resolve inputs
        id: resolve
        env:
          IN_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          IN_KERNEL_VERSION: ${{ inputs.kernel_version }}
          IN_VDS_BRANCH: ${{ inputs.vds_branch }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          upstream_ref="${IN_UPSTREAM_REF:-master}"
          kernel_version="${IN_KERNEL_VERSION:-}"
          vds_branch="${IN_VDS_BRANCH:-master}"
          case "${IN_DRY_RUN:-true}" in
            false|False|FALSE|0) dry_run=false ;;
            *) dry_run=true ;;
          esac
          {
            echo "UPSTREAM_REF=$upstream_ref"
            echo "KERNEL_VERSION=$kernel_version"
            echo "VDS_BRANCH=$vds_branch"
            echo "DRY_RUN=$dry_run"
          } >> "$GITHUB_ENV"
          {
            echo "upstream_ref=$upstream_ref"
            echo "kernel_version=$kernel_version"
            echo "vds_branch=$vds_branch"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref kernel_version=${kernel_version:-latest} vds_branch=$vds_branch dry_run=$dry_run"

      - name: Download local CI image
        if: ${{ inputs.ci_image_source == 'build' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-image-tmp
          path: /tmp

      - name: Acquire CI image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${CI_IMAGE_SOURCE}" = "build" ]; then
            img="$(docker load --input /tmp/ci-image.tar | sed -n 's/^Loaded image: //p' | head -n1)"
            [ -n "${img}" ] || { echo "::error::docker load returned no image"; exit 1; }
          else
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            img="${CI_IMAGE_REGISTRY_REF}"
          fi
          docker tag "${img}" ci-image:work
          docker rmi "${img}" >/dev/null 2>&1 || true

      - name: Start merge container
        run: |
          set -euo pipefail
          docker run -d --name merge --privileged \
            -v "$GITHUB_WORKSPACE":/work \
            ci-image:work sleep infinity

      - name: Verify CI image tooling
        run: |
          set -euo pipefail
          docker exec merge bash -c '
            set -euo pipefail
            missing=""
            for tool in git make curl tar gzip base64 awk sed nm modinfo find; do
              command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
            done
            if [ -n "$missing" ]; then
              echo "::error::CI image is missing tools:${missing}"
              exit 1
            fi
            echo "CI image tooling verified: git make curl tar gzip base64 awk sed"
          '

      - name: Checkout VDS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VDS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          docker exec -e GITHUB_TOKEN -e VDS_REPO -e VDS_BRANCH merge bash -c '
            set -euo pipefail
            rm -rf /tmp/vds
            auth="$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 -w0)"
            git -c http.extraheader="AUTHORIZATION: basic ${auth}" clone \
              --branch "$VDS_BRANCH" "https://github.com/${VDS_REPO}.git" /tmp/vds
            git -C /tmp/vds remote set-url origin "https://github.com/${VDS_REPO}.git"
          '

      - name: Install dependencies
        run: |
          set -euo pipefail
          docker exec merge bash -c 'bash /tmp/vds/scripts/setup.sh -d -y'

      - name: Fetch upstream
        run: |
          set -euo pipefail
          docker exec -e UPSTREAM_REF -e UPSTREAM_REPO merge bash -c '
            set -euo pipefail
            rm -rf /tmp/upstream
            # Full clone is required to diff root files against the previous upstream tag.
            git clone --branch "$UPSTREAM_REF" \
              "https://github.com/${UPSTREAM_REPO}.git" /tmp/upstream
            [ -d /tmp/upstream/src ] || { echo "::error::upstream src not found"; exit 1; }
          '

      - name: Prepare merged tree
        id: prepare
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-prepare.sh" <<'SCRIPT'
          set -euo pipefail
          rm -rf /tmp/vds-merge
          mkdir -p /tmp/vds-merge
          cp -a /tmp/vds/. /tmp/vds-merge/

          # Upstream-owned directories are replaced by the fresh upstream copy.
          rm -rf /tmp/vds-merge/src /tmp/vds-merge/debian /tmp/vds-merge/kernel-tree-scripts
          cp -a /tmp/upstream/src /tmp/vds-merge/
          [ -d /tmp/upstream/debian ] && cp -a /tmp/upstream/debian /tmp/vds-merge/ || true
          [ -d /tmp/upstream/kernel-tree-scripts ] && cp -a /tmp/upstream/kernel-tree-scripts /tmp/vds-merge/ || true

          # VDS overlay (rule 11): changed files live in internal/vds/src.
          [ -d /tmp/vds-merge/internal/vds/src ] || { echo "::error::internal/vds/src not found"; exit 1; }
          cp -a /tmp/vds-merge/internal/vds/src/. /tmp/vds-merge/src/

          # Оверлей правок compat (зонды): применяется поверх свежего апстрима.
          # Патч не лёг → апстрим менял эти блоки → останавливаемся, не собирая вслепую.
          if [ -f internal/vds/patches/compat-probes.patch ]; then
          patch -p1 --fuzz=0 -d /tmp/vds-merge < internal/vds/patches/compat-probes.patch \
          || { echo "::error::compat-probes.patch failed — апстрим менял compat.h, патч нужно перегенерировать"; exit 1; }
          fi

          # Previous upstream version from the VDS branch, used for the root-file diff.
          prev_version="$(tr -d '[:space:]' < /tmp/vds-merge/internal/config/version)"

          # Version: tag name if it looks like a version, otherwise upstream version.h.
          if [[ "$UPSTREAM_REF" == v* ]]; then
            version="${UPSTREAM_REF#v}"
          else
            version="$(sed -n 's/.*WIREGUARD_VERSION[[:space:]]*"$[^"]*$".*/\1/p' /tmp/upstream/src/version.h | head -n1)"
            version="${version%-vds}"
          fi
          [ -n "$version" ] || { echo "::error::could not resolve upstream version"; exit 1; }

          printf '%s\n' "$version" > /tmp/vds-merge/internal/config/version
          printf '%s\n' "$UPSTREAM_REF" > /tmp/vds-merge/internal/config/upstream
          printf '%s-vds\n' "$version" > /tmp/vds-merge/internal/config/current
          sed -i "s/^#define WIREGUARD_VERSION .*/#define WIREGUARD_VERSION \"${version}-vds\"/" \
            /tmp/vds-merge/src/version.h
          cp /tmp/vds-merge/src/version.h /tmp/vds-merge/internal/vds/src/version.h

          # Root-level upstream files are owned by VDS: report only what changed upstream
          # between the previous upstream version and the target ref (rule 11).
          base_ref=""
          for candidate in "v${prev_version}" "${prev_version}"; do
            if git -C /tmp/upstream rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
              base_ref="$candidate"
              break
            fi
          done
          changes=""
          if [ -n "$base_ref" ]; then
            changes="$(git -C /tmp/upstream diff --name-only "$base_ref" "$UPSTREAM_REF" \
              | awk -F/ 'NF==1' | tr '\n' ' ')"
          else
            echo "::warning::Previous upstream tag ${prev_version} not found; root-file diff skipped"
          fi

          printf 'version=%s\n' "$version" > /work/out-prepare.env
          printf 'root_changes=%s\n' "$changes" >> /work/out-prepare.env
          echo "Merged tree prepared, version ${version}-vds, root changes: ${changes:-none}"
          SCRIPT
          docker exec -e UPSTREAM_REF merge bash /work/ci-prepare.sh
          cat "$GITHUB_WORKSPACE/out-prepare.env" >> "$GITHUB_OUTPUT"

      - name: Build and test the merged tree
        id: build
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-build.sh" <<'SCRIPT'
          set -euo pipefail
          cd /tmp/vds-merge
          bash scripts/setup.sh -l -y -k "$KERNEL_VERSION" -s
          make -C src print-version
          kernel_used="${KERNEL_VERSION:-$(ls -1 /lib/modules | sort -V | tail -n1)}"
          ko="$(find "/lib/modules/${kernel_used}" -name 'amneziawg.ko*' | head -n1)"
          [ -n "$ko" ] || { echo "::error::amneziawg.ko not found for ${kernel_used}"; exit 1; }
          vermagic="$(modinfo -F vermagic "$ko")"
          case "$vermagic" in
            *"$kernel_used"*) ;;
            *) echo "::error::vermagic mismatch: module '$vermagic' vs kernel '$kernel_used'"; exit 1 ;;
          esac

          # Проверка символов: всё, что требует модуль, должно экспортироваться ядром.
          # (modpost уже валидирует основные случаи; это явный гейт + отчёт.)
          symvers="/usr/src/kernels/${kernel_used}/Module.symvers"
          [ -f "$symvers" ] || { echo "::error::Module.symvers not found for ${kernel_used}"; exit 1; }
          nm -u "$ko" | awk '{print $NF}' | sed 's/.*@//' | sort -u | grep -Ev '^(__crc_|mcount$|_ftrace)' > /tmp/undef.txt || true
          awk '{print $2}' "$symvers" | sort -u > /tmp/exported.txt
          missing="$(comm -23 /tmp/undef.txt /tmp/exported.txt | sed '/^$/d')"
          if [ -n "$missing" ]; then
            {
              echo "Missing symbols in kernel ${kernel_used}:"
              printf '%s\n' "$missing" | sed 's/^/- /'
            } > /work/out-symbols.txt
            echo "::error::Symbols missing in kernel ${kernel_used}: $(printf '%s ' $missing)"
            exit 1
          fi

          printf 'kernel_version=%s\n' "$kernel_used" > /work/out-build.env
          printf 'vermagic=%s\n' "$vermagic" >> /work/out-build.env
          echo "Built for kernel ${kernel_used} (vermagic OK)"
          SCRIPT
          docker exec -e KERNEL_VERSION merge bash /work/ci-build.sh
          cat "$GITHUB_WORKSPACE/out-build.env" >> "$GITHUB_OUTPUT"
          {
            echo "- tested kernel: \`${KERNEL_VERSION:-latest}\`"
            echo "- vermagic: \`$(grep -oP 'vermagic=\K.*' "$GITHUB_WORKSPACE/out-build.env")\`"
            echo "- undefined symbols: resolved against \`${KERNEL_VERSION:-latest}\` Module.symvers"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload missing symbols report
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: missing-symbols-${{ github.run_attempt }}
          path: out-symbols.txt
          if-no-files-found: ignore

      - name: Report upstream root file changes
        if: ${{ steps.prepare.outputs.root_changes != '' && env.TELEGRAM_ENABLED == 'true' && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROOT_CHANGES: ${{ steps.prepare.outputs.root_changes }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Upstream root files differ: ${ROOT_CHANGES}"
            exit 0
          fi
          text="merge.yml: upstream ${UPSTREAM_REF} changed root files: ${ROOT_CHANGES}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null

      - name: Push merge result
        if: ${{ steps.resolve.outputs.dry_run == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-push.sh" <<'SCRIPT'
          set -euo pipefail
          cd /tmp/vds-merge
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge upstream ${UPSTREAM_REF}" || true
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${VDS_BRANCH}"
          SCRIPT
          docker exec -e GITHUB_TOKEN -e UPSTREAM_REF -e VDS_BRANCH merge bash /work/ci-push.sh

      - name: Stop merge container
        if: ${{ always() }}
        run: docker rm -f merge || true

  stable:
    needs: merge
    if: ${{ needs.merge.result == 'success' && needs.merge.outputs.dry_run == 'false' }}
    uses: ./.github/workflows/stable.yml
    with:
      version: ${{ needs.merge.outputs.version }}
      vds_branch: ${{ needs.merge.outputs.vds_branch }}
      kernel_version: ${{ needs.merge.outputs.kernel_version }}
      dry_run: false
      notify_mode: ${{ needs.merge.outputs.notify_mode || 'changes' }}
    secrets: inherit

  notify:
    needs: merge
    if: ${{ always() && needs.merge.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Telegram on result
        if: ${{ env.TELEGRAM_ENABLED == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: ${{ needs.merge.outputs.notify_mode || 'changes' }}
          UPSTREAM_REF: ${{ needs.merge.outputs.upstream_ref }}
          MERGE_RESULT: ${{ needs.merge.result }}
          VERSION: ${{ needs.merge.outputs.version }}
          DRY_RUN: ${{ needs.merge.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${NOTIFY_MODE:-changes}" = "none" ]; then
            echo "notifications disabled (notify_mode=none)"
            exit 0
          fi
          if [ "$MERGE_RESULT" = "success" ] && [ "${NOTIFY_MODE:-changes}" = "changes" ] && [ "${DRY_RUN:-true}" = "true" ]; then
            echo "dry-run merge succeeded — nothing to report (notify_mode=changes)"
            exit 0
          fi
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          text="merge.yml: ${MERGE_RESULT} for ${UPSTREAM_REF:-unknown ref} (version: ${VERSION:-unknown}, dry_run: ${DRY_RUN:-true}). Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
