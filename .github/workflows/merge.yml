# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Merge Upstream

on:
  workflow_call:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch; empty = internal/config/upstream"
        required: false
        default: ""
        type: string
      kernel_version:
        description: "Target kernel version; empty means the latest available in the CI image"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "VDS branch to merge into"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none|changes|always; none = disable notifications; changes = failures and real merges; always = also dry-run results"
        required: false
        default: ""
        type: string
      ci_image_ref:
        description: "CI image ref; empty = CI_IMAGE_REGISTRY_REF:current"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch; empty = internal/config/upstream"
        required: false
        default: ""
        type: string
      kernel_version:
        description: "Target kernel version (empty = latest in image, or e.g. 6.12.0-281.el10.x86_64)"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "VDS branch to merge into"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Do not push merge results"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none: disable notifications; changes: failures and real merges; always: also dry-run results"
        required: false
        default: changes
        type: choice
        options:
          - none
          - changes
          - always
      ci_image_ref:
        description: "CI image ref; empty = CI_IMAGE_REGISTRY_REF:current"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write
  packages: write

env:
  UPSTREAM_REPO: amnezia-vpn/amneziawg-linux-kernel-module
  NOTIFY_MODE: ${{ inputs.notify_mode || 'changes' }}
  # База без тега: по умолчанию берём :current, который собирает check-upstream.yml.
  CI_IMAGE_REGISTRY_REF: ghcr.io/vados-dev/amneziawg-linux-kernel-module-vds/centos10

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      kernel_version: ${{ steps.build.outputs.kernel_version }}
      version: ${{ steps.prepare.outputs.version }}
      vds_branch: ${{ steps.resolve.outputs.vds_branch }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      notify_mode: ${{ steps.notify.outputs.notify_mode }}
    steps:
      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          # none = отправку выключить полностью; inherit = взять NOTIFY_MODE из
          # репозитарной переменной (fallback: changes); changes/always — как есть.
          raw="${NOTIFY_MODE:-changes}"
          case "$raw" in
            none) mode=none ;;
            changes|always) mode="$raw" ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${raw}' - falling back to changes"; mode="${NOTIFY_MODE_VAR:-changes}" ;;
          esac
          case "$mode" in
            none|changes|always) ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${mode}' - falling back to changes"; mode=changes ;;
          esac
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw})"

      - name: Resolve inputs
        id: resolve
        env:
          IN_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          IN_KERNEL_VERSION: ${{ inputs.kernel_version }}
          IN_VDS_BRANCH: ${{ inputs.vds_branch }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_CI_IMAGE_REF: ${{ inputs.ci_image_ref }}
        run: |
          set -euo pipefail
          # Пустой upstream_ref = «взять из internal/config/upstream» (его пишет check-upstream.yml).
          upstream_ref="${IN_UPSTREAM_REF:-}"
          kernel_version="${IN_KERNEL_VERSION:-}"
          vds_branch="${IN_VDS_BRANCH:-master}"
          ci_image_ref="${IN_CI_IMAGE_REF:-${CI_IMAGE_REGISTRY_REF}:current}"
          case "${IN_DRY_RUN:-true}" in
            false|False|FALSE|0) dry_run=false ;;
            *) dry_run=true ;;
          esac
          {
            echo "UPSTREAM_REF=$upstream_ref"
            echo "KERNEL_VERSION=$kernel_version"
            echo "VDS_BRANCH=$vds_branch"
            echo "CI_IMAGE_REF=$ci_image_ref"
            echo "DRY_RUN=$dry_run"
          } >> "$GITHUB_ENV"
          {
            echo "upstream_ref=$upstream_ref"
            echo "kernel_version=$kernel_version"
            echo "vds_branch=$vds_branch"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "upstream_ref=${upstream_ref:-<from config>} kernel_version=${kernel_version:-latest} vds_branch=$vds_branch dry_run=$dry_run image=$ci_image_ref"

      - name: Acquire CI image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${CI_IMAGE_REF}"
          docker tag "${CI_IMAGE_REF}" ci-image:work

      - name: Start merge container
        run: |
          set -euo pipefail
          docker run -d --name merge --privileged \
            -v "$GITHUB_WORKSPACE":/work \
            ci-image:work sleep infinity

      - name: Verify CI image tooling
        run: |
          set -euo pipefail
          docker exec merge bash -c '
            set -euo pipefail
            missing=""
            for tool in git make curl tar gzip base64 awk sed nm modinfo find; do
              command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
            done
            if [ -n "$missing" ]; then
              echo "::error::CI image is missing tools:${missing}"
              exit 1
            fi
            echo "CI image tooling verified"
          '

      - name: Checkout VDS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VDS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          docker exec -e GITHUB_TOKEN -e VDS_REPO -e VDS_BRANCH merge bash -c '
            set -euo pipefail
            rm -rf /tmp/vds
            auth="$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 -w0)"
            git -c http.extraheader="AUTHORIZATION: basic ${auth}" clone \
              --branch "$VDS_BRANCH" "https://github.com/${VDS_REPO}.git" /tmp/vds
            git -C /tmp/vds remote set-url origin "https://github.com/${VDS_REPO}.git"
          '

      - name: Install dependencies
        run: |
          set -euo pipefail
          docker exec merge bash -c 'bash /tmp/vds/scripts/setup.sh -d -y'

      - name: Fetch upstream
        run: |
          set -euo pipefail
          docker exec -e UPSTREAM_REF -e UPSTREAM_REPO merge bash -c '
            set -euo pipefail
            rm -rf /tmp/upstream
            ref="${UPSTREAM_REF:-}"
            if [ -z "$ref" ] && [ -f /tmp/vds/internal/config/upstream ]; then
              ref="$(tr -d "[:space:]" < /tmp/vds/internal/config/upstream)"
            fi
            [ -n "$ref" ] || { echo "::error::upstream ref unresolved (empty input and config)"; exit 1; }
            echo "Upstream ref: $ref"
            # Full clone: нужен для diff корневых файлов между предыдущим тегом и целью.
            git clone --branch "$ref" \
              "https://github.com/${UPSTREAM_REPO}.git" /tmp/upstream \
              || { echo "::error::git clone failed for ref $ref — ref есть в ${UPSTREAM_REPO}?"; exit 1; }
            [ -d /tmp/upstream/src ] || { echo "::error::upstream src not found"; exit 1; }
          '

      - name: Prepare merged tree
        id: prepare
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-prepare.sh" <<'SCRIPT'
          set -euo pipefail
          rm -rf /tmp/vds-merge
          mkdir -p /tmp/vds-merge
          cp -a /tmp/vds/. /tmp/vds-merge/

          # Upstream-owned directories are replaced by the fresh upstream copy.
          rm -rf /tmp/vds-merge/src /tmp/vds-merge/debian /tmp/vds-merge/kernel-tree-scripts
          cp -a /tmp/upstream/src /tmp/vds-merge/
          [ -d /tmp/upstream/debian ] && cp -a /tmp/upstream/debian /tmp/vds-merge/ || true
          [ -d /tmp/upstream/kernel-tree-scripts ] && cp -a /tmp/upstream/kernel-tree-scripts /tmp/vds-merge/ || true

          # VDS overlay (rule 11): changed files live in internal/vds/src.
          [ -d /tmp/vds-merge/internal/vds/src ] || { echo "::error::internal/vds/src not found"; exit 1; }
          cp -a /tmp/vds-merge/internal/vds/src/. /tmp/vds-merge/src/

          # Зонды compat: скрипт правит шим-блоки по уникальным якорям.
          # Отсутствие якоря = громкий отказ (апстрим менял compat.h).
          bash /tmp/vds-merge/internal/vds/scripts/compat-probes.sh /tmp/vds-merge/src/compat/compat.h

          die() { echo "::error::$1"; exit 1; }

          # Конфиг VDS. Санитизация: старая схема писала суффикс -vds во все три
          # файла — отрезаем его везде, чистое значение пишем ниже.
          read_cfg() { tr -d '[:space:]' < "$1" 2>/dev/null || true; }
          cfg_dir=/tmp/vds-merge/internal/config
          prev_version="$(read_cfg "$cfg_dir/version")"; prev_version="${prev_version%-vds}"
          cfg_upstream="$(read_cfg "$cfg_dir/upstream")"; cfg_upstream="${cfg_upstream%-vds}"

          # Целевой ref: явный вход > конфиг. Тег или ветка — решает сам апстрим.
          target="${UPSTREAM_REF:-$cfg_upstream}"
          [ -n "$target" ] || die "upstream ref unresolved: ни входа, ни internal/config/upstream"

          # Ref обязан существовать. Мусор от старой схемы (v3.1...-vds) не резолвится —
          # тогда предупреждение и откат на master, а не падение.
          if ! git -C /tmp/upstream rev-parse -q --verify "${target}^{commit}" >/dev/null 2>&1; then
            echo "::warning::configured upstream ref '${target}' not found in upstream; falling back to master"
            target=master
          fi

          if git -C /tmp/upstream rev-parse -q --verify "refs/tags/${target}^{commit}" >/dev/null 2>&1; then
            is_tag=1
            echo "Upstream ref is a tag: $target"
          else
            is_tag=0
            echo "Upstream ref is a branch: $target"
          fi

          # Версия: с тега — из version.h на этом теге; с ветки — из рабочей копии.
          # Guard-обёртка (#ifndef) в файле игнорируется: берём только строку #define.
          if [ "$is_tag" = "1" ]; then
            version="$(git -C /tmp/upstream show "${target}:src/version.h" \
              | grep -m1 '#define[[:space:]]*WIREGUARD_VERSION' \
              | awk -F'"' '{print $2}')"
          else
            vh="/tmp/upstream/src/version.h"
            [ -f "$vh" ] || die "src/version.h not found in upstream tree"
            version="$(grep -m1 '#define[[:space:]]*WIREGUARD_VERSION' "$vh" \
              | awk -F'"' '{print $2}')"
          fi

          version="${version%-vds}"
          if [ -z "$version" ]; then
            echo "::error::could not resolve upstream version from ref $target; version.h content:"
            if [ "$is_tag" = "1" ]; then
              git -C /tmp/upstream show "${target}:src/version.h" >&2 || true
            else
              cat /tmp/upstream/src/version.h >&2 || true
            fi
            exit 1
          fi

          # Разложить по конфигу: upstream = целевой ref (БЕЗ -vds), version = чистая
          # апстримная версия, current = сборочная версия форка.
          printf '%s\n' "$target" > "$cfg_dir/upstream"
          printf '%s\n' "$version" > "$cfg_dir/version"
          printf '%s-vds\n' "$version" > "$cfg_dir/current"
          sed -i "s/^#define WIREGUARD_VERSION .*/#define WIREGUARD_VERSION \"${version}-vds\"/" \
            /tmp/vds-merge/src/version.h
          cp /tmp/vds-merge/src/version.h /tmp/vds-merge/internal/vds/src/version.h

          # Root-file diff: апстримные корневые файлы принадлежат VDS (rule 11),
          # сравниваем предыдущий апстримный тег с целью.
          base_ref=""
          for candidate in "v${prev_version}" "${prev_version}"; do
            if git -C /tmp/upstream rev-parse -q --verify "refs/tags/${candidate}^{commit}" >/dev/null 2>&1; then
              base_ref="$candidate"
              break
            fi
          done
          changes=""
          if [ -n "$base_ref" ]; then
            changes="$(git -C /tmp/upstream diff --name-only "$base_ref" "$target" \
              | awk -F/ 'NF==1' | tr '\n' ' ')"
          else
            echo "::warning::Previous upstream tag v${prev_version:-<empty>} not found; root-file diff skipped"
          fi

          printf '%s\n' "$changes" > /tmp/root_changes.txt
          printf '%s\n' "$version" > /tmp/prepare.env
          echo "Merged tree prepared, version ${version}-vds, ref $target, root changes: ${changes:-none}"
          SCRIPT
          docker exec -e UPSTREAM_REF merge bash /work/ci-prepare.sh
          changes="$(docker exec merge cat /tmp/root_changes.txt)"
          version="$(docker exec merge cat /tmp/prepare.env)"
          echo "root_changes=$changes" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test the merged tree
        id: build
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-build.sh" <<'SCRIPT'
          set -euo pipefail
          cd /tmp/vds-merge
          bash scripts/setup.sh -l -y -k "$KERNEL_VERSION" -s
          make -C src print-version
          kernel_used="${KERNEL_VERSION:-$(for d in /lib/modules/*/; do basename "$d"; done | sort -V | tail -n1)}"
          mkdir -p /tmp/vds-merge/internal/config
          printf '%s\n' "$kernel_used" > /tmp/vds-merge/internal/config/kernel
          echo "tested kernel recorded: ${kernel_used}"
          ko="$(find "/lib/modules/${kernel_used}" -name 'amneziawg.ko*' | head -n1)"
          [ -n "$ko" ] || { echo "::error::amneziawg.ko not found for ${kernel_used}"; exit 1; }
          vermagic="$(modinfo -F vermagic "$ko")"
          case "$vermagic" in
            *"$kernel_used"*) ;;
            *) echo "::error::vermagic mismatch: module '$vermagic' vs kernel '$kernel_used'"; exit 1 ;;
          esac

          # Проверка символов: всё, что требует модуль, должно экспортироваться ядром.
          # (modpost уже валидирует основные случаи; это явный гейт + отчёт.)
          symvers="/usr/src/kernels/${kernel_used}/Module.symvers"
          [ -f "$symvers" ] || { echo "::error::Module.symvers not found for ${kernel_used}"; exit 1; }
          nm -u "$ko" | awk '{print $NF}' | sed 's/.*@//' | sort -u | grep -Ev '^(__crc_|mcount$|_ftrace)' > /tmp/undef.txt || true
          awk '{print $2}' "$symvers" | sort -u > /tmp/exported.txt
          missing="$(comm -23 /tmp/undef.txt /tmp/exported.txt | sed '/^$/d')"
          if [ -n "$missing" ]; then
            {
              echo "Missing symbols in kernel ${kernel_used}:"
              printf '%s\n' "$missing" | sed 's/^/- /'
            } > /work/out-symbols.txt
            echo "::error::Symbols missing in kernel ${kernel_used}: $(printf '%s ' $missing)"
            exit 1
          fi

          printf 'kernel_version=%s\n' "$kernel_used" > /work/out-build.env
          printf 'vermagic=%s\n' "$vermagic" >> /work/out-build.env
          echo "Built for kernel ${kernel_used} (vermagic OK)"
          SCRIPT
          docker exec -e KERNEL_VERSION merge bash /work/ci-build.sh
          cat "$GITHUB_WORKSPACE/out-build.env" >> "$GITHUB_OUTPUT"
          {
            echo "- tested kernel: \`${KERNEL_VERSION:-latest}\`"
            echo "- vermagic: \`$(grep -oP 'vermagic=\K.*' "$GITHUB_WORKSPACE/out-build.env")\`"
            echo "- undefined symbols: resolved against \`${KERNEL_VERSION:-latest}\` Module.symvers"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload missing symbols report
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: missing-symbols-${{ github.run_attempt }}
          path: out-symbols.txt
          if-no-files-found: ignore

      - name: Report upstream root file changes
        if: ${{ steps.prepare.outputs.root_changes != '' && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROOT_CHANGES: ${{ steps.prepare.outputs.root_changes }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Upstream root files differ: ${ROOT_CHANGES}"
            exit 0
          fi
          text="merge.yml: upstream ${UPSTREAM_REF} changed root files: ${ROOT_CHANGES}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null

      - name: Push merge result
        if: ${{ steps.resolve.outputs.dry_run == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/ci-push.sh" <<'SCRIPT'
          set -euo pipefail
          cd /tmp/vds-merge
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge upstream ${UPSTREAM_REF}" || true
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          branch="testing-${VERSION}-vds"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push --force origin "HEAD:refs/heads/${branch}"
          SCRIPT
          docker exec -e GITHUB_TOKEN -e UPSTREAM_REF -e VERSION merge bash /work/ci-push.sh

      - name: Stop merge container
        if: ${{ always() }}
        run: docker rm -f merge || true

  notify:
    needs: merge
    if: ${{ always() && needs.merge.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Telegram on result
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MODE: ${{ needs.merge.outputs.notify_mode || 'changes' }}
          UPSTREAM_REF: ${{ needs.merge.outputs.upstream_ref }}
          MERGE_RESULT: ${{ needs.merge.result }}
          VERSION: ${{ needs.merge.outputs.version }}
          DRY_RUN: ${{ needs.merge.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${NOTIFY_MODE:-changes}" = "none" ]; then
            echo "notifications disabled (notify_mode=none)"
            exit 0
          fi
          if [ "$MERGE_RESULT" = "success" ] && [ "${NOTIFY_MODE:-changes}" = "changes" ] && [ "${DRY_RUN:-true}" = "true" ]; then
            echo "dry-run merge succeeded — nothing to report (notify_mode=changes)"
            exit 0
          fi
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          text="merge.yml: ${MERGE_RESULT} for ${UPSTREAM_REF:-unknown ref} (version: ${VERSION:-unknown}, dry_run: ${DRY_RUN:-true}). Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
