name: Create stable tag

on:
  workflow_call:
    inputs:
      version:
        description: "Version to tag (default: internal/config/current)"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "Source branch for the stable release"
        required: false
        default: "master"
        type: string
      kernel_version:
        description: "Kernel version the merge was tested on; recorded into internal/config/tested-kernel"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Do not create tag, release or update the stable branch"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none|inherit|changes|always; none and inherit defer to repository variable NOTIFY_MODE"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (default: internal/config/current)"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "Source branch for the stable release"
        required: false
        default: "master"
        type: string
      kernel_version:
        description: "Kernel version to record (empty = keep existing file)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Do not create tag, release or update the stable branch"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none|inherit|changes|always; none and inherit defer to repository variable NOTIFY_MODE"
        required: false
        default: inherit
        type: string

permissions:
  contents: write

env:
  TELEGRAM_ENABLED: ${{ vars.TELEGRAM_NOTIFY != 'false' }}
  NOTIFY_MODE: ${{ inputs.notify_mode || 'inherit' }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.vds_branch }}
          fetch-depth: 0

      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          # none = отправку выключить полностью; inherit = взять NOTIFY_MODE из
          # репозитарной переменной (fallback: changes); changes/always — как есть.
          raw="${NOTIFY_MODE_INPUT:-inherit}"
          case "$raw" in
            none) mode=none ;;
            changes|always) mode="$raw" ;;
            inherit) mode="${NOTIFY_MODE_VAR:-changes}" ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${raw}' - falling back to inherit"; mode="${NOTIFY_MODE_VAR:-changes}" ;;
          esac
          case "$mode" in
            none|changes|always) ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${mode}' - falling back to changes"; mode=changes ;;
          esac
          if [ "${TELEGRAM_ENABLED:-true}" != "true" ]; then
            echo "TELEGRAM_NOTIFY=false - notifications disabled"
            mode=none
          fi
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw}, repository=${NOTIFY_MODE_VAR:-unset})"

      - name: Resolve version, tag and branch
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.vds_branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH:-master}"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < internal/config/current)"
          fi
          case "$version" in
            v*) tag="$version" ;;
            *)  tag="v${version}" ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (branch: $branch)"

      # Запись ядра, на котором реально прошла сборка и тест — единственный
      # источник правды для отката на предыдущую stable-ветку.
      - name: Record tested kernel
        if: ${{ inputs.dry_run == false && inputs.kernel_version != '' }}
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          printf '%s\n' "$KERNEL_VERSION" > internal/config/tested-kernel
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/config/tested-kernel
          git commit -m "Record tested kernel: ${KERNEL_VERSION}"
          git push origin "HEAD:${BRANCH}"

      - name: Build release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="amneziawg-${VERSION}/" \
            -o "dist/amneziawg-${VERSION}.tar.gz" HEAD
          sha256sum "dist/amneziawg-${VERSION}.tar.gz" > "dist/amneziawg-${VERSION}.tar.gz.sha256"

      - name: Create tag and GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; bump version or delete the tag"
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --notes "VDS release ${VERSION}. Tested on kernel: ${KERNEL_VERSION:-unknown}."

      - name: Recreate stable branch from source branch
        if: ${{ inputs.dry_run == false }}
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B stable "origin/${BRANCH}"
          git push origin +HEAD:stable

      - name: Notify Telegram
        if: ${{ always() && env.TELEGRAM_ENABLED == 'true' && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${NOTIFY_MODE:-changes}" = "changes" ] && [ "${DRY_RUN:-true}" = "true" ]; then
            echo "dry-run release succeeded — nothing to report (notify_mode=changes)"
            exit 0
          fi
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ]; then
            text="stable.yml: released ${TAG:-unknown tag} (kernel: ${KERNEL_VERSION:-unknown}, dry_run: ${DRY_RUN:-true}). Logs: ${run_url}"
          else
            text="stable.yml: ${JOB_STATUS} for ${TAG:-unknown tag} (kernel: ${KERNEL_VERSION:-unknown}, dry_run: ${DRY_RUN:-true}). Logs: ${run_url}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
