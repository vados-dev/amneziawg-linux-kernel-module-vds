name: Create stable tag

on:
  workflow_call:
    inputs:
      version:
        description: "Version to tag (default: internal/config/current)"
        required: false
        default: ""
        type: string
      vds_branch:
        description: "Source branch for the stable release"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Do not create tag, release or update the stable branch"
        required: false
        default: true
        type: boolean
      notify_mode:
        description: "none|inherit|changes|always; none and inherit defer to repository variable NOTIFY_MODE"
        required: false
        default: "none"
        type: string

permissions:
  contents: write

env:
  # Repository variable TELEGRAM_NOTIFY=false is a global kill switch.
  TELEGRAM_ENABLED: ${{ vars.TELEGRAM_NOTIFY != 'false' }}
  NOTIFY_MODE_INPUT: ${{ inputs.notify_mode }}
  NOTIFY_MODE_VAR: ${{ vars.NOTIFY_MODE }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.vds_branch }}
          fetch-depth: 0

      - name: Resolve notification mode
        id: notify
        run: |
          set -euo pipefail
          # Explicit caller values win over the repository variable; none/inherit defer to it.
          raw="${NOTIFY_MODE_INPUT:-none}"
          case "$raw" in
            changes|always) mode="$raw" ;;
            *) mode="${NOTIFY_MODE_VAR:-changes}" ;;
          esac
          case "$mode" in
            none|changes|always) ;;
            *) echo "::warning::Unknown NOTIFY_MODE '${mode}' - falling back to changes"; mode=changes ;;
          esac
          if [ "${TELEGRAM_ENABLED:-true}" != "true" ]; then
            echo "TELEGRAM_NOTIFY=false - notifications disabled"
            mode=none
          fi
          echo "NOTIFY_MODE=$mode" >> "$GITHUB_ENV"
          echo "notify_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "notify_mode=${mode} (input=${raw}, repository=${NOTIFY_MODE_VAR:-unset})"

      - name: Resolve version, tag and branch
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.vds_branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH:-master}"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < internal/config/current)"
          fi
          case "$version" in
            v*) tag="$version" ;;
            *)  tag="v${version}" ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (branch: $branch)"

      - name: Build release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="amneziawg-${VERSION}/" \
            -o "dist/amneziawg-${VERSION}.tar.gz" HEAD
          sha256sum "dist/amneziawg-${VERSION}.tar.gz" > "dist/amneziawg-${VERSION}.tar.gz.sha256"

      - name: Create tag and GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --notes "VDS release ${VERSION}."

      - name: Recreate stable branch from source branch
        if: ${{ inputs.dry_run == false }}
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B stable "origin/${BRANCH}"
          git push origin --delete stable || true
          git push origin stable

      - name: Notify Telegram
        if: ${{ always() && env.TELEGRAM_ENABLED == 'true' && env.NOTIFY_MODE != 'none' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.tag }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${NOTIFY_MODE:-changes}" = "changes" ] && [ "${DRY_RUN:-true}" = "true" ]; then
            echo "dry-run release succeeded — nothing to report (notify_mode=changes)"
            exit 0
          fi
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "::warning::Telegram secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not configured — skipping notification"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ]; then
            text="stable.yml: released ${TAG:-unknown tag} (dry_run: ${DRY_RUN:-true}). Logs: ${run_url}"
          else
            text="stable.yml: ${JOB_STATUS} for ${TAG:-unknown tag} (dry_run: ${DRY_RUN:-true}). Logs: ${run_url}"
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
